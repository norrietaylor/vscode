# Minimal config for developing min-vscode in a box.

[upstream] # Source of software & tooling
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "aec0d376947eec2272a67ee4cf7cad832bacb7a1"

[defaults]
state_key = "dev"

# A dev session has what `just check` and `just vsix` need: the CLI and its
# tests (POSIX sh, shellcheck, jq, ssh, ps, bash and zsh for the completion
# parse checks), the settings merger (python) and the extension (node + npm).
[session]
packages = [
  "base", "git", "vim",
  "just", "shellcheck", "jq", "python", "openssh", "procps-ng", "bash", "zsh",
  "node",
]

# min task run check: the whole suite, installing the extension's build tools
# first when they are missing.
[tasks.check]
packages = ["base", "just", "shellcheck", "jq", "python", "openssh", "procps-ng", "bash", "zsh", "node"]
bash = "[ -d extension/node_modules ] || just ext-deps; just check"

# min task run vsix: build min-vscode.vsix (install it into VS Code on the host).
[tasks.vsix]
packages = ["base", "just", "node"]
bash = "just vsix"
